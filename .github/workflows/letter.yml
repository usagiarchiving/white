# 하시온(내 여보♡) 메시지·편지 (김민정 첫 화면 → 퀘스트 아래 버튼)
#   - 아침·점심·저녁 메시지: 아래 예약 시각에 자동
#   - 내가 보낸 메시지에 답장 / 밤 편지(하루 한 통) / 편지 답글: 사이트에서 실행
# → minjung/letters.json 에 저장
# 설정: 저장소 Settings → Secrets and variables → Actions → New repository secret
#   이름: GEMINI_API_KEY      값: AI Studio에서 받은 키 (AQ. 로 시작)
#   이름: VAPID_PRIVATE_KEY   값: 웹앱 알림용 비밀 키 (없으면 알림만 안 감)
# 캐릭터·모델 바꾸기: minjung/sion.json
name: letter

on:
  schedule:
    - cron: '2 23 * * *'     # 한국 시간 아침 8:02
    - cron: '32 3 * * *'     # 점심 12:32
    - cron: '2 10 * * *'     # 저녁 7:02
  workflow_dispatch:
    inputs:
      mode:
        description: 'chat = 메시지 답장 · letter = 오늘 편지 · reply = 편지 답글 · message = 시간대 메시지'
        required: true
        default: chat
        type: choice
        options: [chat, letter, reply, message]
      date:
        description: '날짜 (YYYY-MM-DD, 비우면 오늘)'
        required: false
        default: ''
      slot:
        description: 'message일 때: morning / lunch / evening (비우면 지금 시각)'
        required: false
        default: ''
      force:
        description: '이미 있는 편지를 다시 쓰기'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: letter
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet cryptography
      - name: 만들기
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SCHEDULE: ${{ github.event.schedule }}
          MODE: ${{ inputs.mode }}
          DATE: ${{ inputs.date }}
          SLOT: ${{ inputs.slot }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ -n "$SCHEDULE" ]; then
            # 예약 실행은 늦게 시작될 수 있어서 시각 대신 어느 예약인지로 시간대를 정함
            case "$SCHEDULE" in
              '2 23 * * *')  slot=morning ;;
              '32 3 * * *')  slot=lunch ;;
              *)             slot=evening ;;
            esac
            args=(message --slot "$slot")
          else
            args=("$MODE")
            [ -n "$DATE" ] && args+=(--date "$DATE")
            [ -n "$SLOT" ] && args+=(--slot "$SLOT")
            [ "$FORCE" = "true" ] && args+=(--force)
          fi
          python .github/scripts/letter.py "${args[@]}" --out "$RUNNER_TEMP/patch.json"
      - name: 저장
        id: save
        run: |
          if [ ! -f "$RUNNER_TEMP/patch.json" ]; then echo '변경 없음'; exit 0; fi
          git config user.name 'sion-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # 그 사이 사이트에서 메시지를 보냈어도 겹치지 않게: 최신본을 받고 결과만 덧붙여서 올림
          for i in 1 2 3 4 5; do
            git fetch -q origin "${GITHUB_REF_NAME}"
            git reset -q --hard FETCH_HEAD
            python .github/scripts/letter.py apply "$RUNNER_TEMP/patch.json"
            git add minjung/letters.json
            git diff --cached --quiet && { echo '변경 없음'; exit 0; }
            git commit -q -m '김민정: 시온 메시지'
            if git push -q origin "HEAD:${GITHUB_REF_NAME}"; then echo saved=1 >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep $((i * 3))
          done
          exit 1
      - name: 웹앱 알림
        if: steps.save.outputs.saved == '1'
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: python .github/scripts/letter.py notify "$RUNNER_TEMP/patch.json"
