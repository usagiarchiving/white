# 매일 아침 오하아사(おは朝) 별자리 운세를 받아 diary/ohaasa.json 으로 저장
# (사이트에서 바로 받으면 브라우저가 막기 때문에 GitHub이 대신 받아 둠)
name: ohaasa

on:
  schedule:
    # 한국 시간 아침 7:20, 8:20, 9:20 (방송 뒤 갱신되도록 몇 번 확인)
    - cron: '20 22 * * *'
    - cron: '20 23 * * *'
    - cron: '20 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ohaasa
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 운세 받기
        run: |
          curl -fsSL --retry 3 -A 'Mozilla/5.0' \
            https://www.asahi.co.jp/data/ohaasa2020/horoscope.json -o /tmp/oha.json
          jq -e 'length > 0' /tmp/oha.json > /dev/null
          mkdir -p diary
          jq '.' /tmp/oha.json > diary/ohaasa.json
      - name: 바뀌었으면 저장
        run: |
          if git diff --quiet -- diary/ohaasa.json && git ls-files --error-unmatch diary/ohaasa.json > /dev/null 2>&1; then
            echo '변경 없음'; exit 0
          fi
          cp diary/ohaasa.json "$RUNNER_TEMP/ohaasa.json"
          git config user.name 'ohaasa-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # 최신본 위에 이 파일만 바꿔서 올림 (pull --rebase 는 쓰지 않음: 저장소 기록이 바뀌어도 옛 기록을 다시 올리지 않게)
          for i in 1 2 3 4 5; do
            git fetch -q origin "${GITHUB_REF_NAME}"
            git reset -q --hard FETCH_HEAD
            cp "$RUNNER_TEMP/ohaasa.json" diary/ohaasa.json
            git add diary/ohaasa.json
            git diff --cached --quiet && { echo '변경 없음'; exit 0; }
            git commit -q -m 'diary: 오하아사 운세'
            git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 3))
          done
          exit 1
